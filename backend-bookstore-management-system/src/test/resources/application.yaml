spring:
  sql:
    init:
      mode: never
  datasource:
    url: "jdbc:sqlite:./target/bms-test.db"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-init-sql: "PRAGMA foreign_keys=ON"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
