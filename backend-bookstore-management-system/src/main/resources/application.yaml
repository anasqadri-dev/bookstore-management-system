spring:
  sql:
    init:
      mode: always
  application:
    name: backend-bookstore-management-system
  datasource:
    url: jdbc:sqlite:${bms.database.path}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA foreign_keys=ON"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

bms:
  database:
    path: ${BMS_DATABASE_PATH:${APPDATA:${user.home}/AppData/Roaming}/BookstoreManagementSystem/bookstore.db}

  business-time-zone: Asia/Karachi

  bootstrap-admin:
    enabled: true
    username: admin
    password: admin
    full-name: Store Administrator