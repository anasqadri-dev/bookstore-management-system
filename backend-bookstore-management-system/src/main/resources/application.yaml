spring:
  application:
    name: backend-bookstore-management-system
  datasource:
    url: jdbc:sqlite:./data/bookstore.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080