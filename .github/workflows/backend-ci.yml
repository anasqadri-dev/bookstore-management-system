name: Backend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "backend-bookstore-management-system/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop]
    paths:
      - "backend-bookstore-management-system/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Maven tests (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend-bookstore-management-system/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: backend-bookstore-management-system
        run: chmod +x mvnw

      - name: Run backend test suite
        working-directory: backend-bookstore-management-system
        run: ./mvnw -B clean test
