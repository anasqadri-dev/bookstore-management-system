name: Dependency Security Audit

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend-bookstore-management-system/pom.xml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend-bookstore-management-system/pom.xml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm high/critical dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked direct and transitive dependencies
        run: npm audit --package-lock-only --audit-level=high

  maven-audit:
    name: Maven dependency vulnerability audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-bookstore-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend-bookstore-management-system/pom.xml
      - name: Check backend dependencies for CVSS 7+ vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          delay=6000
          args=(-B org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdMaxRetryCount=10)
          if [ -n "$NVD_API_KEY" ]; then
            delay=600
            args+=("-DnvdApiKey=$NVD_API_KEY")
          fi
          args+=("-DnvdApiDelay=$delay" "-DnvdValidForHours=24")
          bash ./mvnw "${args[@]}"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: backend-bookstore-management-system/target/dependency-check-report.*
          if-no-files-found: ignore
