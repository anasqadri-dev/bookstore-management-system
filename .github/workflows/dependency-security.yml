name: Dependency Security Audit

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend-bookstore-management-system/pom.xml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend-bookstore-management-system/pom.xml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Maven dependency manifest changes
    runs-on: ubuntu-latest
    outputs:
      backend_pom: ${{ steps.filter.outputs.backend_pom }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          changed=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            if git diff --name-only "FETCH_HEAD...HEAD" | grep -Eq "^(backend-bookstore-management-system/pom.xml|.github/workflows/dependency-security.yml)$"; then
              changed=true
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" | grep -Eq "^(backend-bookstore-management-system/pom.xml|.github/workflows/dependency-security.yml)$"; then
              changed=true
            fi
          else
            changed=true
          fi
          echo "backend_pom=$changed" >> "$GITHUB_OUTPUT"

  npm-audit:
    name: npm high/critical dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked direct and transitive dependencies
        run: npm audit --package-lock-only --audit-level=high

  maven-audit:
    name: Maven dependency vulnerability audit
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_pom == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-bookstore-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend-bookstore-management-system/pom.xml
      - name: Restore OWASP Dependency-Check database cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('backend-bookstore-management-system/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Check backend dependencies for CVSS 7+ vulnerabilities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          delay=6000
          args=(-B org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdMaxRetryCount=20 -DdataDirectory="$HOME/.cache/dependency-check")
          if [ -n "$NVD_API_KEY" ]; then
            delay=600
            args+=("-DnvdApiKey=$NVD_API_KEY")
          fi
          args+=("-DnvdApiDelay=$delay" "-DnvdValidForHours=24")
          bash ./mvnw "${args[@]}"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: backend-bookstore-management-system/target/dependency-check-report.*
          if-no-files-found: ignore
