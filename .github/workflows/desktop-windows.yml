name: Windows Desktop CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend-bookstore-management-system/**"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [develop]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend-bookstore-management-system/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend-bookstore-management-system/pom.xml

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js standalone runtime
        run: npm run build:desktop
        working-directory: frontend

      - name: Build and test Spring Boot backend
        run: .\mvnw.cmd -B clean package
        working-directory: backend-bookstore-management-system

      - name: Create bundled Java runtime
        run: jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --output desktop/runtime

      - name: Install pinned Electron packaging tools
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Test desktop process lifecycle and security helpers
        run: npm test
        working-directory: desktop

      - name: Build Windows NSIS installer
        run: npm run dist:win
        working-directory: desktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-management-system-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
