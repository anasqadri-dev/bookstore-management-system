name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write

jobs:
  frontend-checks:
    name: Next.js lint, tests and production build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile for declared dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfile to the same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): refresh frontend lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload refreshed frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend unit and contract tests
        run: npm test

      - name: Run React component and session integration tests
        run: npm run test:ui

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
